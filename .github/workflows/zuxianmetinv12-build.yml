name: Build ZuxianMetin v1.2

on:
  push:
    branches: ["zuxianmetin-build"]
    paths:
      - "zuxianmetinv12/**"
      - ".github/workflows/zuxianmetinv12-build.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zuxianmetinv12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build with Maven
        run: mvn -B clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZuxianMetin-v1.2-jar
          path: zuxianmetinv12/target/ZuxianMetin-1.2.0-Paper26.2.jar
