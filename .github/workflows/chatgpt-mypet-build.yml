name: ChatGPT MyPet v4 Build

on:
  push:
    branches: [chatgpt-mypet-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone MyPet v4 source
        run: git clone --depth 1 --branch 4.0.3-alpha-03 https://github.com/MyPetORG/MyPet.git mypet

      - name: Build MyPet
        working-directory: mypet
        run: ./gradlew --no-daemon clean build -PbuildType=alpha -PBUILD_NUMBER=3

      - name: Upload MyPet JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyPet-4.0.3-alpha-03
          path: mypet/build/libs/MyPet-4.0.3-alpha-03.jar
          if-no-files-found: error
          retention-days: 1
