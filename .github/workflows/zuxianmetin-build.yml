name: Build ZuxianMetin

on:
  push:
    branches: ["zuxianmetin-build"]
    paths:
      - "zuxianmetin/**"
      - ".github/workflows/zuxianmetin-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "zuxianmetin/**"
      - ".github/workflows/zuxianmetin-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zuxianmetin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build with Maven
        run: mvn -B clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZuxianMetin-jar
          path: zuxianmetin/target/zuxian-metin-1.0.0.jar
