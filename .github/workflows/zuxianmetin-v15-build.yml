name: Build ZuxianMetin v1.5

on:
  push:
    branches: ["zuxianmetin-build"]
    paths:
      - "tools/build_zuxianmetin_v15.py"
      - ".github/workflows/zuxianmetin-v15-build.yml"
      - "tools/build_zuxianmetin_v14.py"
      - "tools/fix_zuxianmetin_v14.py"
      - "zuxianmetinv13/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Generate v1.5 source
        run: python3 tools/build_zuxianmetin_v15.py
      - name: Build with Maven
        run: mvn -B -f zuxianmetinv14/pom.xml clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZuxianMetin-v1.5-final-jar
          path: zuxianmetinv14/target/ZuxianMetin-1.5.0-Paper26.2.jar
